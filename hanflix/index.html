<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>HANFLIX 연합예배 찬양 리스트</title>
<meta name="description" content="2026 학부합창대회 연합예배 찬양 리스트 · Session 1 5곡, Session 2 2곡">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: HANFLIX(학부합창대회 프로필) 스트리밍 화면 — 검정→남색 바탕, 아치형 파란 워드마크,
   대표작 히어로, 세션 칩, TOP 10식 큰 외곽선 번호. 단일 다크 테마(의도적). */
:root{
  --black:#000;
  --ink-bg:#0a0d1a;      /* 아래로 갈수록 프로필 남색 */
  --navy:#101733;        /* 프로필 원 하단 남색 */
  --card:#151a2e;
  --line:#262d47;
  --blue:#0060d0;        /* HANFLIX 로고 파랑 */
  --blue-hi:#2b86ff;
  --white:#ffffff;
  --gray:#b3b7c4;
  --dim:#7a8094;
  --font-mark:"Anton","Noto Sans KR",sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--black);}
body{font-family:var(--font-body);color:var(--white);line-height:1.45;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  background:var(--black);}
.wrap{max-width:560px;margin:0 auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));padding-block:0 calc(56px + env(safe-area-inset-bottom, 0px));}

/* ── 상단 바: 아치형 HANFLIX 워드마크 ── */
.bar{display:flex;align-items:center;justify-content:space-between;padding-top:20px;}
.wordmark{display:flex;align-items:center;font-family:var(--font-mark);font-size:34px;line-height:1;color:var(--blue);letter-spacing:.01em;}
.wordmark span{display:inline-block;transform-origin:50% 50%;}
.wordmark span:nth-child(1),.wordmark span:nth-child(7){transform:scaleY(1.18);}
.wordmark span:nth-child(2),.wordmark span:nth-child(6){transform:scaleY(1.06);}
.wordmark span:nth-child(3),.wordmark span:nth-child(5){transform:scaleY(.98);}
.wordmark span:nth-child(4){transform:scaleY(.95);}
.handle{font-size:13px;color:var(--dim);}

/* ── 대표작 히어로 ── */
.hero{position:relative;margin:22px calc(-1 * max(18px, env(safe-area-inset-left, 0px))) 0;aspect-ratio:4/5;max-height:560px;overflow:hidden;}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9);}
.hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(0,0,0,.6) 0,rgba(0,0,0,.25) 26%,rgba(0,0,0,.55) 52%,rgba(0,0,0,.92) 80%,var(--black) 100%);}
.hero .info{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 max(18px, env(safe-area-inset-left, 0px)) 6px;text-align:center;}
.series{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.24em;color:var(--gray);}
.series b{font-family:var(--font-mark);font-size:22px;font-weight:400;letter-spacing:0;color:var(--blue);}
.hero h1{font-size:clamp(36px,11vw,52px);font-weight:900;line-height:1.1;letter-spacing:-0.04em;margin-top:10px;text-wrap:balance;}
.hero .sub{font-size:16px;font-weight:500;color:var(--white);margin-top:8px;}
.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin-top:12px;font-size:13px;color:var(--gray);}
.meta span + span::before{content:"·";margin-right:10px;color:var(--dim);}
.meta .hd::before{content:none;}
.meta .hd{border:1px solid var(--dim);border-radius:3px;padding:0 5px;font-size:11px;line-height:18px;}
.hero-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;}
.hbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:6px;border:0;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;}
.hbtn.play{background:var(--white);color:#000;}
.hbtn.more{background:rgba(109,115,135,.45);color:var(--white);}
.hbtn:active{opacity:.85;}
.hbtn:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px;}
.hint{text-align:center;font-size:13px;color:var(--dim);margin-top:14px;}

/* ── 세션 칩 ── */
.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;padding:14px 0;margin-top:22px;background:linear-gradient(var(--black) 75%,rgba(0,0,0,0));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--black);}
.chips{display:flex;gap:8px;}
.chips button{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border:1px solid rgba(255,255,255,.55);border-radius:19px;background:transparent;color:var(--white);
  font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;}
.chips button small{font-size:12px;color:var(--gray);}
.chips button[aria-selected="true"]{background:var(--white);border-color:var(--white);color:#000;font-weight:700;}
.chips button[aria-selected="true"] small{color:#444;}
.chips button:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px;}

.row-title{font-size:19px;font-weight:700;margin:6px 0 14px;}
.row-title small{font-size:13px;font-weight:400;color:var(--gray);margin-left:6px;}
.panel{display:none;}
.panel.active{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── 곡 카드: TOP 10식 큰 외곽선 번호 ── */
.list{display:flex;flex-direction:column;gap:22px;}
.song{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;}
.song:focus-visible{outline:2px solid var(--blue-hi);outline-offset:4px;border-radius:6px;}
.shot{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--card);transition:transform .15s;}
.song:active .shot{transform:scale(.985);}
.shot img{width:100%;height:100%;object-fit:cover;display:block;}
.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 45%);}
.rank{position:absolute;left:10px;bottom:-14px;z-index:1;font-family:var(--font-mark);font-size:104px;line-height:1;color:#000;
  -webkit-text-stroke:3px var(--blue-hi);paint-order:stroke fill;text-shadow:0 2px 12px rgba(0,0,0,.6);}
.badge{position:absolute;right:10px;top:10px;z-index:1;font-family:var(--font-mark);font-size:15px;line-height:1;color:var(--white);background:var(--blue);padding:5px 7px 4px;border-radius:3px;letter-spacing:.04em;}
.cap{display:flex;align-items:center;gap:12px;margin-top:12px;}
.cap .t{flex:1;min-width:0;}
.title{font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-0.03em;}
.go{font-size:14px;font-weight:500;color:var(--blue-hi);margin-top:4px;}
.pbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;flex:none;color:var(--white);}

.end{margin-top:40px;padding:18px 0 8px;border-top:1px solid var(--line);background:radial-gradient(120% 140% at 50% 120%,var(--navy),transparent 70%);font-size:13px;color:var(--dim);line-height:1.7;}
.end b{font-family:var(--font-mark);font-weight:400;font-size:16px;color:var(--blue);letter-spacing:.02em;}

/* ── 상세 시트 ── */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
.dim.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:#181818;border-radius:12px 12px 0 0;overflow:hidden;
  padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;}
.sheet.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1);}
.player{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;}
.player img{width:100%;height:100%;object-fit:cover;display:block;}
.player .big-play{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid var(--white);color:var(--white);
  display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.player:active .big-play{transform:scale(.94);}
.player:focus-visible{outline:2px solid var(--blue-hi);outline-offset:-2px;}
.close{position:absolute;right:12px;top:12px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:var(--white);font-size:20px;line-height:34px;cursor:pointer;}
.s-body{padding:16px max(18px, env(safe-area-inset-right, 0px)) 0 max(18px, env(safe-area-inset-left, 0px));}
.s-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--gray);}
.s-label b{font-family:var(--font-mark);font-weight:400;font-size:18px;letter-spacing:0;color:var(--blue);}
.sheet h2{font-size:24px;font-weight:900;letter-spacing:-0.03em;line-height:1.3;margin:8px 0 16px;}
.btns{display:flex;flex-direction:column;gap:8px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:6px;border:0;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;}
.btn.primary{background:var(--white);color:#000;}
.btn.ghost{background:#2b2b2b;color:var(--white);}
.btn:active{opacity:.85;}
.btn:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px;}

.toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);background:var(--white);color:#000;
  font-size:15px;font-weight:500;padding:12px 20px;border-radius:6px;opacity:0;transition:opacity .2s,transform .2s;z-index:30;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<div class="wrap">
  <div class="bar">
    <span class="wordmark" aria-label="HANFLIX"><span>H</span><span>A</span><span>N</span><span>F</span><span>L</span><span>I</span><span>X</span></span>
    <span class="handle">@hgu.choir.contest</span>
  </div>

  <header class="hero">
    <img id="heroImg" alt="">
    <div class="info">
      <p class="series"><b>H</b>연합예배</p>
      <h1>찬양 리스트</h1>
      <p class="sub">2026 학부합창대회 연합예배</p>
      <p class="meta"><span>2026</span><span>세션 2개</span><span>7곡</span><span class="hd">HD</span></p>
      <div class="hero-btns">
        <button class="hbtn play" id="playFirst" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>첫 곡 듣기</button>
        <a class="hbtn more" href="#list">목록 보기</a>
      </div>
    </div>
  </header>
  <p class="hint">곡을 누르고 썸네일을 누르면 유튜브로 이동해요.</p>

  <div class="tabs" id="list">
    <div class="chips" role="tablist" id="tabs"></div>
  </div>

  <main id="panels"></main>

  <p class="end"><b>HANFLIX</b><br>2026 학부합창대회 연합예배 · @hgu.choir.contest</p>
</div>

<div class="dim" id="dim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle" aria-hidden="true">
  <button class="close" id="sClose" type="button" aria-label="닫기">×</button>
  <div id="sMedia"></div>
  <div class="s-body">
    <p class="s-label" id="sLabel"></p>
    <h2 id="sTitle"></h2>
    <div class="btns">
      <a class="btn primary" id="sOpen" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>유튜브에서 열기</a>
      <button class="btn ghost" id="sCopy" type="button">링크 복사</button>
    </div>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>

  const thumb = id => THUMBS[id] || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const url = id => `https://youtu.be/${id}`;
  const play = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>`;

  $('#heroImg').src = thumb(SESSIONS[0].songs[0].id);

  const tabs = $('#tabs'), panels = $('#panels');
  SESSIONS.forEach((s, si) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab');
    b.innerHTML = `${esc(s.name)}<small>${s.songs.length}곡</small>`;
    b.onclick = () => selectTab(si);
    tabs.appendChild(b);

    const p = document.createElement('div');
    p.className = 'panel'; p.setAttribute('role', 'tabpanel');
    p.innerHTML = `<h3 class="row-title">${esc(s.name)}<small>${s.songs.length}곡</small></h3>
      <div class="list">${s.songs.map((song, i) => `
      <button class="song" type="button" data-s="${si}" data-i="${i}">
        <div class="shot">
          <img src="${thumb(song.id)}" alt="" loading="lazy" onerror="this.remove()">
          <span class="rank" aria-hidden="true">${i + 1}</span>
          <span class="badge">H</span>
        </div>
        <div class="cap">
          <div class="t"><p class="title">${esc(song.title)}</p><p class="go">링크 바로가기 →</p></div>
          <span class="pbtn">${play(16)}</span>
        </div>
      </button>`).join('')}</div>`;
    panels.appendChild(p);
  });

  function selectTab(i){
    [...tabs.children].forEach((b, k) => b.setAttribute('aria-selected', k === i));
    [...panels.children].forEach((p, k) => p.classList.toggle('active', k === i));
    try { localStorage.setItem('hanflix-tab', i); } catch(e){}
  }
  let start = 0;
  try { start = Math.min(+localStorage.getItem('hanflix-tab') || 0, SESSIONS.length - 1); } catch(e){}
  selectTab(start);

  panels.addEventListener('click', e => {
    const el = e.target.closest('button.song');
    if (el) openSheet(SESSIONS[el.dataset.s], +el.dataset.i);
  });
  $('#playFirst').onclick = () => openSheet(SESSIONS[0], 0);

  const sheet = $('#sheet'), dim = $('#dim'), openBtn = $('#sOpen'), copyBtn = $('#sCopy');
  let current = null;
  function openSheet(session, i){
    const song = session.songs[i];
    current = song;
    $('#sLabel').innerHTML = `<b>H</b>${esc(session.name.toUpperCase())} · ${i + 1}번째 곡`;
    $('#sTitle').textContent = song.title;
    $('#sMedia').innerHTML = `<a class="player" href="${url(song.id)}" target="_blank" rel="noopener" aria-label="${esc(song.title)} 유튜브에서 보기">
        <img src="${thumb(song.id)}" alt="" onerror="this.remove()">
        <span class="big-play">${play(26)}</span>
      </a>`;
    openBtn.href = url(song.id);
    sheet.classList.add('open'); dim.classList.add('open'); sheet.setAttribute('aria-hidden', 'false');
  }
  function closeSheet(){
    sheet.classList.remove('open'); dim.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true');
    setTimeout(() => { if (!sheet.classList.contains('open')) $('#sMedia').innerHTML = ''; }, 260);
  }
  dim.onclick = closeSheet;
  $('#sClose').onclick = closeSheet;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  // 시트를 아래로 끌어서 닫기
  let y0 = null;
  sheet.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, {passive:true});
  sheet.addEventListener('touchend', e => {
    if (y0 !== null && e.changedTouches[0].clientY - y0 > 80) closeSheet();
    y0 = null;
  });

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
  }
  copyBtn.onclick = async () => {
    if (!current) return;
    try { await navigator.clipboard.writeText(url(current.id)); toast('링크를 복사했어요'); }
    catch(e){ toast(url(current.id)); }
  };
</script>
</body>
