<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>포항해군교회 찬양 리스트</title>
<meta name="description" content="포항해군교회 예배 찬양 리스트 · 전반전 3곡, 후반전 4곡">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 함정 항해일지처럼 — 짙은 해군 남색 바탕, 정복 흰색 글자, 계급장 금색 포인트, 로프 구분선.
   단일 다크 테마(의도적). */
:root{
  --navy-900:#07162b;   /* 바탕: 심해 남색 */
  --navy-800:#0d2242;   /* 카드 */
  --navy-700:#16325c;   /* 테두리, 비활성 탭 */
  --ivory:#f3efe3;      /* 정복 흰색 */
  --mist:#a9b8cc;       /* 보조 글자 */
  --fog:#6f84a3;        /* 가장 약한 글자 */
  --gold:#d4ad4a;       /* 계급장 금색 */
  --gold-deep:#a8862f;
  --signal:#c8323c;     /* 신호기 적색 — 아주 적게 */
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mark:"Barlow Condensed","IBM Plex Sans KR",sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--navy-900);}
body{font-family:var(--font-body);color:var(--ivory);line-height:1.45;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  background:
    linear-gradient(rgba(169,184,204,.045) 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,rgba(169,184,204,.045) 1px,transparent 1px) 0 0/32px 100%,
    var(--navy-900);}
.wrap{max-width:560px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));padding-block:0 calc(56px + env(safe-area-inset-bottom, 0px));}

/* ── 상단: 소속 표기 + 닻 엠블럼 ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:24px;}
.unit{font-family:var(--font-mark);font-size:14px;font-weight:600;letter-spacing:.18em;color:var(--mist);text-transform:uppercase;}
.emblem{width:46px;height:46px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);flex:none;}
.emblem svg{width:26px;height:26px;}

/* ── 히어로 ── */
.hero{padding:44px 0 26px;}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--gold);}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--gold);}
.hero h1{font-size:clamp(40px,12vw,58px);font-weight:700;line-height:1.08;letter-spacing:-0.04em;margin-top:14px;text-wrap:balance;}
.hero h1 em{font-style:normal;color:var(--gold);}
.hero .lead{font-size:16px;color:var(--mist);margin-top:16px;}
/* 로프(밧줄) 구분선 */
.rope{height:8px;margin-top:26px;color:var(--gold-deep);
  background:repeating-linear-gradient(-55deg,currentColor 0 3px,transparent 3px 7px);
  -webkit-mask:linear-gradient(#000 0 0) center/100% 4px no-repeat;mask:linear-gradient(#000 0 0) center/100% 4px no-repeat;opacity:.9;}
.order{display:flex;gap:18px;margin-top:16px;font-family:var(--font-mark);font-size:15px;font-weight:600;letter-spacing:.08em;color:var(--fog);}
.order b{color:var(--ivory);font-weight:700;}

/* ── 전반전 / 후반전 탭 ── */
.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--navy-900);padding:10px 0 16px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--navy-900);}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--navy-700);border-radius:6px;overflow:hidden;}
.seg button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px;border:0;background:transparent;color:var(--mist);font:inherit;cursor:pointer;text-align:left;transition:background .15s,color .15s;}
.seg button + button{border-left:1.5px solid var(--navy-700);}
.seg .en{font-family:var(--font-mark);font-size:12px;font-weight:600;letter-spacing:.2em;}
.seg .ko{font-size:19px;font-weight:700;letter-spacing:-0.02em;}
.seg .ko small{font-size:13px;font-weight:400;margin-left:6px;opacity:.75;}
.seg button[aria-selected="true"]{background:var(--gold);color:var(--navy-900);}
.seg button:focus-visible{outline:2px solid var(--ivory);outline-offset:-4px;}

.panel{display:none;}
.panel.active{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── 곡 카드 ── */
.list{display:flex;flex-direction:column;gap:14px;}
.song{display:flex;flex-direction:column;width:100%;padding:0;border:1px solid var(--navy-700);border-radius:8px;overflow:hidden;background:var(--navy-800);
  color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .12s,border-color .12s;}
.song:active{transform:scale(.985);}
@media (hover:hover){.song:hover{border-color:var(--gold-deep);}}
.song:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.thumb{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
/* 인식표(도그태그) 모양 번호 */
.tag-no{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border-radius:14px 4px 4px 14px;
  background:var(--ivory);color:var(--navy-900);font-family:var(--font-mark);font-size:15px;font-weight:700;letter-spacing:.06em;}
.tag-no::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--navy-900);opacity:.85;}
.body{padding:18px 20px 0;}
.title{font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-0.03em;}
.foot{display:flex;align-items:center;justify-content:space-between;margin:16px 20px 0;padding:14px 0 16px;border-top:1px dashed var(--navy-700);}
.go{font-size:16px;font-weight:500;color:var(--gold);}
.play{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--navy-900);display:flex;align-items:center;justify-content:center;flex:none;}

.end{display:flex;align-items:center;gap:12px;margin-top:36px;font-size:13px;color:var(--fog);}
.end svg{width:18px;height:18px;color:var(--gold-deep);flex:none;}

/* ── 바텀 시트 ── */
.dim{position:fixed;inset:0;background:rgba(3,10,20,.75);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
.dim.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--navy-800);border:1px solid var(--navy-700);border-bottom:0;border-top:4px solid var(--gold);
  border-radius:14px 14px 0 0;padding:14px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;}
.sheet.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1);}
.grip{width:40px;height:4px;border-radius:2px;background:var(--navy-700);margin:0 auto 16px;}
.s-label{font-family:var(--font-mark);font-size:14px;font-weight:600;letter-spacing:.16em;color:var(--gold);}
.sheet h2{font-size:24px;font-weight:700;letter-spacing:-0.03em;line-height:1.3;margin:8px 0 16px;}
.player{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000;margin-bottom:14px;}
.player img{width:100%;height:100%;object-fit:cover;display:block;}
.player .big-play{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:var(--gold);color:var(--navy-900);
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .12s;}
.player:active .big-play{transform:scale(.94);}
.player:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:8px;}
.btn{display:flex;align-items:center;justify-content:center;height:54px;border-radius:6px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;}
.btn:active{opacity:.85;}
.btn:focus-visible{outline:2px solid var(--ivory);outline-offset:2px;}
.btn.ghost{background:transparent;color:var(--ivory);border:1.5px solid var(--navy-700);}
.btn.primary{background:var(--ivory);color:var(--navy-900);border:0;}

.toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);background:var(--ivory);color:var(--navy-900);
  font-size:15px;font-weight:500;padding:12px 20px;border-radius:6px;opacity:0;transition:opacity .2s,transform .2s;z-index:30;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div class="wrap">
  <div class="top">

    <span class="emblem" aria-hidden="true"><svg><use href="#anchor"/></svg></span>

  <header class="hero">

    <h1>찬양 <em>리스트</em></h1>
    <p class="lead">곡을 누르고 썸네일을 누르면 유튜브로 이동해요.</p>
    <div class="rope" aria-hidden="true"></div>
    <p class="order"><span>전반전 <b>3곡</b></span><span>후반전 <b>4곡</b></span></p>
  </header>

  <div class="tabs">
    <div class="seg" role="tablist" id="tabs"></div>
  </div>

  <main id="panels"></main>

  <p class="end"><svg aria-hidden="true"><use href="#anchor"/></svg>포항해군교회 · 함께 드리는 예배</p>
</div>

<div class="dim" id="dim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle" aria-hidden="true">
  <div class="grip"></div>
  <p class="s-label" id="sLabel"></p>
  <h2 id="sTitle"></h2>
  <div id="sMedia"></div>
  <div class="btns">
    <button class="btn ghost" id="sCopy" type="button">링크 복사</button>
    <a class="btn primary" id="sOpen" target="_blank" rel="noopener">유튜브에서 열기</a>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>

  const thumb = id => THUMBS[id] || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const url = id => `https://youtu.be/${id}`;
  const pad = n => String(n).padStart(2, '0');
  const play = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>`;

  const tabs = $('#tabs'), panels = $('#panels');
  SESSIONS.forEach((s, si) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab');
    b.innerHTML = `<span class="en">${s.en}</span><span class="ko">${s.ko}<small>${s.songs.length}곡</small></span>`;
    b.onclick = () => selectTab(si);
    tabs.appendChild(b);

    const p = document.createElement('div');
    p.className = 'panel'; p.setAttribute('role', 'tabpanel');
    p.innerHTML = `<div class="list">${s.songs.map((song, i) => `
      <button class="song" type="button" data-s="${si}" data-i="${i}">
        <div class="thumb">
          <img src="${thumb(song.id)}" alt="" loading="lazy" onerror="this.remove()">
          <span class="tag-no">NO.${pad(i + 1)}</span>
        </div>
        <div class="body"><p class="title">${esc(song.title)}</p></div>
        <div class="foot"><span class="go">링크 바로가기 →</span><span class="play">${play(18)}</span></div>
      </button>`).join('')}</div>`;
    panels.appendChild(p);
  });

  function selectTab(i){
    [...tabs.children].forEach((b, k) => b.setAttribute('aria-selected', k === i));
    [...panels.children].forEach((p, k) => p.classList.toggle('active', k === i));
    try { localStorage.setItem('navy-tab', i); } catch(e){}
  }
  let start = 0;
  try { start = Math.min(+localStorage.getItem('navy-tab') || 0, SESSIONS.length - 1); } catch(e){}
  selectTab(start);

  panels.addEventListener('click', e => {
    const el = e.target.closest('button.song');
    if (el) openSheet(SESSIONS[el.dataset.s], +el.dataset.i);
  });

  const sheet = $('#sheet'), dim = $('#dim'), openBtn = $('#sOpen'), copyBtn = $('#sCopy');
  let current = null;
  function openSheet(session, i){
    const song = session.songs[i];
    current = song;
    $('#sLabel').textContent = `${session.en} · NO.${pad(i + 1)}`;
    $('#sTitle').textContent = song.title;
    $('#sMedia').innerHTML = `<a class="player" href="${url(song.id)}" target="_blank" rel="noopener" aria-label="${esc(song.title)} 유튜브에서 보기">
        <img src="${thumb(song.id)}" alt="" onerror="this.remove()">
        <span class="big-play">${play(26)}</span>
      </a>`;
    openBtn.href = url(song.id);
    sheet.classList.add('open'); dim.classList.add('open'); sheet.setAttribute('aria-hidden', 'false');
  }
  function closeSheet(){
    sheet.classList.remove('open'); dim.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true');
    setTimeout(() => { if (!sheet.classList.contains('open')) $('#sMedia').innerHTML = ''; }, 260);
  }
  dim.onclick = closeSheet;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  // 시트를 아래로 끌어서 닫기
  let y0 = null;
  sheet.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, {passive:true});
  sheet.addEventListener('touchend', e => {
    if (y0 !== null && e.changedTouches[0].clientY - y0 > 80) closeSheet();
    y0 = null;
  });

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
  }
  copyBtn.onclick = async () => {
    if (!current) return;
    try { await navigator.clipboard.writeText(url(current.id)); toast('링크를 복사했어요'); }
    catch(e){ toast(url(current.id)); }
  };
</script>
</body>
