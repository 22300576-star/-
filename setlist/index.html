:root{

  --fg-4:#7d7d7d;      /* chrome */

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--black);}
body{font-family:"Base","KoddiUD OnGothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;color:var(--ink);
  letter-spacing:-0.01em;word-break:keep-all;-webkit-font-smoothing:antialiased;line-height:1.4;min-height:100vh;overflow-x:hidden;}
b,strong{font-weight:500;color:var(--ink);}
.wrap{max-width:560px;margin:0 auto;padding:0 20px calc(56px + env(safe-area-inset-bottom));}

/* ── chrome: breadcrumb + logo ── */
.chrome{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:22px;}
.chrome .sec{font-size:13px;line-height:1.5;color:var(--fg-4);padding-top:4px;}
.chrome .sec i{font-style:normal;margin:0 7px;color:var(--line-2);}
.chrome .logo{width:132px;height:auto;display:block;flex:none;}

/* ── hero ── */
.hero{padding:40px 0 30px;}
.hero .pre{font-size:18px;font-weight:500;color:var(--fg-2);letter-spacing:0;}
.hero h1{font-size:clamp(56px,17vw,84px);font-weight:700;line-height:1;letter-spacing:-0.06em;margin:10px 0 18px -3px;}
.hero .msg{font-size:clamp(19px,5.6vw,24px);font-weight:500;line-height:1.4;letter-spacing:-0.035em;}
.hero .msg .team{display:block;font-weight:700;letter-spacing:0;margin-bottom:2px;}
.hero .sub{font-size:15px;color:var(--fg-3);line-height:1.5;margin-top:16px;padding-top:16px;border-top:1.5px solid var(--line);}

/* ── session tabs ── */
.tabs{position:sticky;top:0;z-index:5;background:var(--black);padding:10px 0 16px;}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.seg button{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 18px;border:0;background:var(--surface);
  color:var(--fg-3);font:inherit;font-size:18px;font-weight:700;letter-spacing:0;cursor:pointer;transition:background .15s,color .15s;}
.seg button .n{font-size:14px;font-weight:400;}
.seg button[aria-selected="true"]{background:var(--c);color:#000;}

.panel{display:none;}
.panel.active{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── song cards ── */
.list{display:flex;flex-direction:column;gap:12px;}
.song{display:flex;flex-direction:column;width:100%;padding:0;border:0;background:var(--surface);color:inherit;font:inherit;text-align:left;}
button.song{cursor:pointer;transition:transform .12s;}
button.song:active{transform:scale(.985);}
.thumb{width:100%;aspect-ratio:16/9;overflow:hidden;position:relative;background:var(--c);}
.thumb img{position:relative;width:100%;height:100%;object-fit:cover;display:block;}
.thumb .deco{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.thumb .deco svg{width:44%;}
.body{padding:22px 22px 0;}
.k{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--fg-3);line-height:1;}
.k i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;}
.title{font-size:26px;font-weight:500;line-height:1.25;letter-spacing:-0.035em;margin-top:14px;}
.medley{font-size:17px;color:var(--fg-3);line-height:1.5;margin-top:6px;}
.tag{display:inline-block;font-weight:700;font-size:13px;line-height:1;letter-spacing:.05em;color:#000;background:var(--c);padding:7px 10px;margin-top:14px;}
.foot{display:flex;align-items:center;justify-content:space-between;margin:22px 22px 0;padding:16px 0 18px;border-top:1.5px solid var(--line-2);}
.foot .go{font-size:17px;font-weight:500;color:var(--ink);}
.foot .play{width:44px;height:44px;border-radius:50%;background:var(--c);color:#000;display:flex;align-items:center;justify-content:center;flex:none;}
.song:not(button) .body{padding-bottom:24px;}

.end{margin-top:36px;padding-top:18px;border-top:1.5px solid var(--line);font-size:13px;color:var(--fg-4);line-height:1.6;}

/* ── bottom sheet ── */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
.dim.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-top:6px solid var(--c);
  padding:14px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;
  transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;}
.sheet.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1);}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 18px;}
.sheet h2{font-size:24px;font-weight:500;letter-spacing:-0.035em;line-height:1.3;margin:12px 0 18px;}
.sheet h2 small{font-size:15px;font-weight:400;color:var(--fg-3);letter-spacing:-0.01em;}
.player{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--c);margin-bottom:14px;}
.player img{width:100%;height:100%;object-fit:cover;display:block;}
.player .big-play{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:var(--c);color:#000;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.player:active .big-play{transform:scale(.94);}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:8px;}
.btn{display:flex;align-items:center;justify-content:center;height:56px;border:0;font:inherit;font-size:17px;font-weight:700;letter-spacing:0;cursor:pointer;text-decoration:none;}
.btn:active{opacity:.85;}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-2);}
.btn.primary{background:var(--ink);color:#000;}

.toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#000;
  font-size:15px;font-weight:500;padding:13px 20px;opacity:0;transition:opacity .2s,transform .2s;z-index:30;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>

  // 곡 데이터 — 링크가 생기면 id에 유튜브 영상 ID만 넣으면 됩니다.
  const SESSIONS = [
    { name: 'SESSION 1', color: 'var(--pink)', songs: [
      { title: 'Easy', id: 'JtaIPz0dDvQ' },
      { title: '성령이여 내 영혼은', medley: '높은 산들 흔들리고', id: '7Dt9mT1c9Fg' },
      { title: 'One Way', ver: 'keepers ver.', id: 'idh_YanAUtE' },
      { title: 'Stand in Your Love', id: 'JOgp_e2FSFo' },
      { title: '주 나타내시네', medley: 'Let It Rain', id: 'r2By2a00ljg' },
    ]},
    { name: 'SESSION 2', color: 'var(--purple)', songs: [
      { title: 'Romans 16:19', id: 'YjFOINMY2hg' },
      { title: '거리마다 기쁨으로', medley: 'Might Get Loud', id: '' },
      { title: '나의 삶 주의 손에', id: 'tOw-m-64pPY' },
      { title: '열린문', ver: '키퍼스워십 자작곡', id: '' },
    ]},
  ];
  const POINTS = ['var(--green)', 'var(--yellow)', 'var(--purple)', 'var(--pink)'];

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const url = id => `https://youtu.be/${id}`;
  const pad = n => String(n).padStart(2, '0');
  const chapel = '<svg viewBox="0 0 280 135"><polygon points="12,0 65,0 276,59 279,134 0,134" fill="#000" opacity=".2"/></svg>';
  const play = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>`;

  const tabs = $('#tabs'), panels = $('#panels');
  SESSIONS.forEach((s, si) => {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'tab'; b.style.setProperty('--c', s.color);
    b.innerHTML = `${esc(s.name)}<span class="n">${s.songs.length}곡</span>`;
    b.onclick = () => selectTab(si);
    tabs.appendChild(b);

    const p = document.createElement('div');
    p.className = 'panel'; p.role = 'tabpanel';
    p.innerHTML = `<div class="list">${s.songs.map((song, i) => {
      const c = POINTS[(i + si) % POINTS.length];
      const tag = song.id ? 'button' : 'div';
      return `
      <${tag} class="song" ${song.id ? 'type="button"' : ''} data-s="${si}" data-i="${i}" style="--c:${c}">
        <div class="thumb">
          <div class="deco">${chapel}</div>
          ${song.id ? `<img src="https://i.ytimg.com/vi/${song.id}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">` : ''}
        </div>
        <div class="body">
          <p class="k"><i></i>SONG ${pad(i + 1)}</p>
          <p class="title">${esc(song.title)}</p>
          ${song.medley ? `<p class="medley">+ ${esc(song.medley)}</p>` : ''}
          ${song.ver ? `<span class="tag">${esc(song.ver)}</span>` : ''}
        </div>
        ${song.id ? `<div class="foot"><span class="go">링크 바로가기 →</span><span class="play">${play(18)}</span></div>` : ''}
      </${tag}>`;
    }).join('')}</div>`;
    panels.appendChild(p);
  });

  function selectTab(i){
    [...tabs.children].forEach((b, k) => b.setAttribute('aria-selected', k === i));
    [...panels.children].forEach((p, k) => p.classList.toggle('active', k === i));
    try { localStorage.setItem('setlist-tab', i); } catch(e){}
  }
  let start = 0;
  try { start = Math.min(+localStorage.getItem('setlist-tab') || 0, SESSIONS.length - 1); } catch(e){}
  selectTab(start);

  panels.addEventListener('click', e => {
    const el = e.target.closest('button.song');
    if (el) openSheet(SESSIONS[el.dataset.s], +el.dataset.i, el.style.getPropertyValue('--c'));
  });

  const sheet = $('#sheet'), dim = $('#dim'), openBtn = $('#sOpen'), copyBtn = $('#sCopy');
  let current = null;
  function openSheet(session, i, color){
    const song = session.songs[i];
    current = song;
    sheet.style.setProperty('--c', color);
    $('#sLabel').innerHTML = `<i></i>${esc(session.name)} · SONG ${pad(i + 1)}`;
    $('#sTitle').innerHTML = esc(song.title) + (song.medley ? ` + ${esc(song.medley)}` : '') +
      (song.ver ? ` <small>(${esc(song.ver)})</small>` : '');
    // 유튜브 썸네일(고화질 → 기본 화질 순으로 시도) — 누르면 유튜브로 이동
    $('#sMedia').innerHTML = `<a class="player" href="${url(song.id)}" target="_blank" rel="noopener" aria-label="${esc(song.title)} 유튜브에서 보기">
        <img src="https://i.ytimg.com/vi/${song.id}/maxresdefault.jpg" alt=""
          onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://i.ytimg.com/vi/${song.id}/hqdefault.jpg'}else{this.remove()}">
        <span class="big-play">${play(26)}</span>
      </a>`;
    openBtn.href = url(song.id);
    sheet.classList.add('open'); dim.classList.add('open'); sheet.setAttribute('aria-hidden', 'false');
  }
  function closeSheet(){
    sheet.classList.remove('open'); dim.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true');
    setTimeout(() => { if (!sheet.classList.contains('open')) $('#sMedia').innerHTML = ''; }, 260);
  }
  dim.onclick = closeSheet;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  // 시트를 아래로 끌어서 닫기
  let y0 = null;
  sheet.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, {passive:true});
  sheet.addEventListener('touchend', e => {
    if (y0 !== null && e.changedTouches[0].clientY - y0 > 80) closeSheet();
    y0 = null;
  });

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
  }
  copyBtn.onclick = async () => {
    if (!current) return;
    try { await navigator.clipboard.writeText(url(current.id)); toast('링크를 복사했어요'); }
    catch(e){ toast(url(current.id)); }
  };
</script>
</body>
</html>
