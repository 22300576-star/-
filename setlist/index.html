<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>키퍼스워십 셋리스트</title>
<meta name="description" content="2026 가을창문축제 키퍼스워십 예배 셋리스트와 곡 링크">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{
    --bg:#f2f4f6;
    --card:#ffffff;
    --ink:#191f28;
    --ink-muted:#4e5968;
    --ink-faint:#8b95a1;
    --border:#e5e8eb;
    --primary:#3182f6;
    --primary-press:#1b64da;
    --weak-bg:#e8f3ff;
    --weak-fg:#1b64da;
    --disabled-bg:#f2f4f6;
    --disabled-fg:#b0b8c1;
    --sheet-dim:rgba(0,0,0,.45);
    --shadow:0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101012;
      --card:#1c1c20;
      --ink:#f2f4f6;
      --ink-muted:#b0b8c1;
      --ink-faint:#7e8794;
      --border:#2c2c33;
      --primary:#3182f6;
      --primary-press:#4b93f7;
      --weak-bg:#1c2b44;
      --weak-fg:#79aefb;
      --disabled-bg:#26262c;
      --disabled-fg:#5c6370;
      --sheet-dim:rgba(0,0,0,.65);
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101012; --card:#1c1c20; --ink:#f2f4f6; --ink-muted:#b0b8c1; --ink-faint:#7e8794;
    --border:#2c2c33; --primary:#3182f6; --primary-press:#4b93f7; --weak-bg:#1c2b44; --weak-fg:#79aefb;
    --disabled-bg:#26262c; --disabled-fg:#5c6370; --sheet-dim:rgba(0,0,0,.65); --shadow:none;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom));}

  header{padding:40px 4px 24px;}
  .eyebrow{display:inline-block;font-size:13px;font-weight:700;color:var(--weak-fg);background:var(--weak-bg);
    padding:6px 10px;border-radius:8px;margin-bottom:14px;}
  h1{font-size:26px;line-height:1.35;font-weight:800;letter-spacing:-.5px;margin:0 0 8px;}
  .sub{font-size:15px;color:var(--ink-muted);margin:0;line-height:1.5;}

  /* segmented tabs */
  .tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px;}
  .seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow);}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink-faint);font:inherit;font-size:15px;font-weight:700;
    padding:11px 0;border-radius:10px;cursor:pointer;transition:background .15s,color .15s;}
  .seg button[aria-selected="true"]{background:var(--weak-bg);color:var(--weak-fg);}
  .seg .count{font-weight:600;margin-left:4px;opacity:.8;}

  .panel{display:none;}
  .panel.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .group{background:var(--card);border-radius:20px;padding:8px;box-shadow:var(--shadow);}
  .song{display:flex;align-items:center;gap:14px;width:100%;padding:12px;border:0;background:transparent;
    color:inherit;font:inherit;text-align:left;border-radius:14px;cursor:pointer;transition:background .12s,transform .12s;}
  .song:active{transform:scale(.98);background:var(--bg);}
  @media (hover:hover){.song:hover{background:var(--bg);}}
  .song + .song{margin-top:2px;}
  .thumb{flex:none;width:96px;aspect-ratio:16/9;border-radius:10px;background:var(--disabled-bg);overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .num{position:absolute;left:6px;top:6px;min-width:20px;height:20px;padding:0 6px;border-radius:6px;
    background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .thumb .ph{font-size:12px;font-weight:700;color:var(--disabled-fg);}
  .meta{flex:1;min-width:0;}
  .title{font-size:16px;font-weight:700;line-height:1.4;margin:0;word-break:keep-all;}
  .medley{font-size:13px;color:var(--ink-faint);margin:3px 0 0;}
  .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--weak-fg);background:var(--weak-bg);
    padding:2px 7px;border-radius:6px;margin-top:6px;margin-right:4px;}
  .tag.off{color:var(--disabled-fg);background:var(--disabled-bg);}
  .chev{flex:none;color:var(--ink-faint);}

  .note{font-size:13px;color:var(--ink-faint);text-align:center;margin:20px 0 0;line-height:1.6;}

  /* bottom sheet */
  .dim{position:fixed;inset:0;background:var(--sheet-dim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
  .dim.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);
    border-radius:24px 24px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);}
  .sheet.open{transform:none;}
  .grip{width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 16px;}
  .sheet .s-label{font-size:13px;font-weight:700;color:var(--weak-fg);margin:0 0 4px;}
  .sheet h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:0 0 16px;line-height:1.35;word-break:keep-all;}
  .player{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-bottom:16px;}
  .player iframe{width:100%;height:100%;border:0;display:block;}
  .empty{width:100%;aspect-ratio:16/9;border-radius:14px;background:var(--disabled-bg);color:var(--ink-faint);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-bottom:16px;font-size:15px;font-weight:600;}
  .btns{display:flex;gap:8px;}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;height:54px;border-radius:14px;border:0;font:inherit;
    font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .12s,transform .12s;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--primary);color:#fff;}
  .btn.primary:active{background:var(--primary-press);}
  .btn.ghost{background:var(--weak-bg);color:var(--weak-fg);flex:0 0 96px;}
  .btn[aria-disabled="true"]{background:var(--disabled-bg);color:var(--disabled-fg);pointer-events:none;}

  .toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:#333d4b;color:#fff;font-size:14px;font-weight:600;padding:12px 18px;border-radius:12px;opacity:0;
    transition:opacity .2s,transform .2s;z-index:30;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">2026 가을창문축제 · 키퍼스워십</span>
    <h1>오늘 함께 부를<br>찬양을 미리 들어보세요</h1>
    <p class="sub">곡을 누르면 바로 영상을 볼 수 있어요.</p>
  </header>

  <div class="tabs">
    <div class="seg" role="tablist" id="tabs"></div>
  </div>

  <main id="panels"></main>

  <p class="note">링크가 없는 곡은 준비되는 대로 추가할게요.<br>Keepers Worship</p>
</div>

<div class="dim" id="dim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle" aria-hidden="true">
  <div class="grip"></div>
  <p class="s-label" id="sLabel"></p>
  <h2 id="sTitle"></h2>
  <div id="sMedia"></div>
  <div class="btns">
    <button class="btn ghost" id="sCopy" type="button">링크 복사</button>
    <a class="btn primary" id="sOpen" target="_blank" rel="noopener">유튜브에서 열기</a>
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
  // 곡 데이터 — 링크가 생기면 id에 유튜브 영상 ID만 넣으면 됩니다.
  const SESSIONS = [
    { name: '세션 1', songs: [
      { title: 'Easy', id: 'JtaIPz0dDvQ' },
      { title: '성령이여 내 영혼은', medley: '높은 산들 흔들리고', id: '7Dt9mT1c9Fg' },
      { title: 'One Way', ver: 'keepers ver.', id: 'idh_YanAUtE' },
      { title: 'Stand in Your Love', id: 'JOgp_e2FSFo' },
      { title: '주 나타내시네', medley: 'Let It Rain', id: 'r2By2a00ljg' },
    ]},
    { name: '세션 2', songs: [
      { title: 'Romans 16:19', id: 'YjFOINMY2hg' },
      { title: '거리마다 기쁨으로', medley: 'Might Get Loud', ver: 'keepers ver.', id: '' },
      { title: '나의 삶 주의 손에', id: 'tOw-m-64pPY' },
      { title: '열린문', ver: '키퍼스 자작곡', id: '' },
    ]},
  ];

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const url = id => `https://youtu.be/${id}`;
  const chev = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

  const tabs = $('#tabs'), panels = $('#panels');
  SESSIONS.forEach((s, si) => {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'tab';
    b.innerHTML = `${esc(s.name)}<span class="count">· ${s.songs.length}곡</span>`;
    b.onclick = () => selectTab(si);
    tabs.appendChild(b);

    const p = document.createElement('div');
    p.className = 'panel'; p.role = 'tabpanel';
    p.innerHTML = `<div class="group">${s.songs.map((song, i) => `
      <button class="song" type="button" data-s="${si}" data-i="${i}">
        <div class="thumb">
          ${song.id ? `<img src="https://i.ytimg.com/vi/${song.id}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">` : '<span class="ph">준비중</span>'}
          <span class="num">${i + 1}</span>
        </div>
        <div class="meta">
          <p class="title">${esc(song.title)}</p>
          ${song.medley ? `<p class="medley">+ ${esc(song.medley)}</p>` : ''}
          ${song.ver ? `<span class="tag">${esc(song.ver)}</span>` : ''}
          ${song.id ? '' : '<span class="tag off">링크 준비중</span>'}
        </div>
        ${chev}
      </button>`).join('')}</div>`;
    panels.appendChild(p);
  });

  function selectTab(i){
    [...tabs.children].forEach((b, k) => b.setAttribute('aria-selected', k === i));
    [...panels.children].forEach((p, k) => p.classList.toggle('active', k === i));
    try { localStorage.setItem('setlist-tab', i); } catch(e){}
  }
  let start = 0;
  try { start = Math.min(+localStorage.getItem('setlist-tab') || 0, SESSIONS.length - 1); } catch(e){}
  selectTab(start);

  panels.addEventListener('click', e => {
    const el = e.target.closest('.song');
    if (el) openSheet(SESSIONS[el.dataset.s], +el.dataset.i);
  });

  const sheet = $('#sheet'), dim = $('#dim'), openBtn = $('#sOpen'), copyBtn = $('#sCopy');
  let current = null;
  function openSheet(session, i){
    const song = session.songs[i];
    current = song;
    $('#sLabel').textContent = `${session.name} · ${i + 1}번째 곡`;
    $('#sTitle').innerHTML = esc(song.title) + (song.medley ? ` + ${esc(song.medley)}` : '') +
      (song.ver ? ` <span style="font-weight:600;color:var(--ink-faint);font-size:15px">(${esc(song.ver)})</span>` : '');
    $('#sMedia').innerHTML = song.id
      ? `<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${song.id}" title="${esc(song.title)}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
      : `<div class="empty">🎵<span>아직 링크가 준비되지 않았어요</span></div>`;
    if (song.id){ openBtn.href = url(song.id); openBtn.removeAttribute('aria-disabled'); }
    else { openBtn.removeAttribute('href'); openBtn.setAttribute('aria-disabled', 'true'); }
    copyBtn.disabled = !song.id;
    copyBtn.setAttribute('aria-disabled', !song.id);
    sheet.classList.add('open'); dim.classList.add('open'); sheet.setAttribute('aria-hidden', 'false');
  }
  function closeSheet(){
    sheet.classList.remove('open'); dim.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true');
    setTimeout(() => { if (!sheet.classList.contains('open')) $('#sMedia').innerHTML = ''; }, 250);
  }
  dim.onclick = closeSheet;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  // 시트를 아래로 끌어서 닫기
  let y0 = null;
  sheet.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, {passive:true});
  sheet.addEventListener('touchend', e => {
    if (y0 !== null && e.changedTouches[0].clientY - y0 > 80) closeSheet();
    y0 = null;
  });

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
  }
  copyBtn.onclick = async () => {
    if (!current || !current.id) return;
    try { await navigator.clipboard.writeText(url(current.id)); toast('링크를 복사했어요'); }
    catch(e){ toast(url(current.id)); }
  };
</script>
</body>
</html>
